name: Apply Public Route Patch

on:
  workflow_dispatch:
  push:
    branches: [fix/atlas-public-route]
    paths:
      - 'scripts/patch_public_routes.py'
      - '.github/workflows/apply-public-route-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atlas-public-route
      - name: Apply route migration
        run: python3 scripts/patch_public_routes.py
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vercel.json trainer.html navigator.html index.html scripts/e2e_trainer.mjs scripts/e2e_atlas.mjs scripts/validate_competition_readiness.py release.json
          if git diff --cached --quiet; then
            echo 'No route changes to commit.'
            exit 0
          fi
          git commit -m 'fix: give Atlas a stable public route'
          git push origin HEAD:fix/atlas-public-route
