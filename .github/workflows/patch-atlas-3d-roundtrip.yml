name: Patch Atlas 3D Round Trip

on:
  push:
    branches:
      - fix/atlas-3d-roundtrip
    paths:
      - scripts/patch_atlas_3d_roundtrip.py
      - .github/workflows/patch-atlas-3d-roundtrip.yml

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[atlas-3d-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atlas-3d-roundtrip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Atlas
        run: python scripts/patch_atlas_3d_roundtrip.py
      - name: Verify patch
        run: |
          grep -q 'OPEN SELECTED GAP IN 3D' index.html
          grep -q "requestedGap=new URLSearchParams" index.html
          grep -q 'navigator.html?gap=${encodeURIComponent(g.id)}' index.html
      - name: Commit patched Atlas
        run: |
          if git diff --quiet -- index.html; then
            echo 'No Atlas changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(atlas): connect selected gap to 3D [atlas-3d-patched]'
          git push origin HEAD:fix/atlas-3d-roundtrip
