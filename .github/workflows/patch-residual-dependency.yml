name: Patch Residual Dependency Engine

on:
  push:
    branches:
      - feat/residual-dependency-engine
    paths:
      - scripts/patch_residual_dependency_engine.py
      - .github/workflows/patch-residual-dependency.yml

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[residual-engine-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/residual-dependency-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Atlas
        run: python scripts/patch_residual_dependency_engine.py
      - name: Verify residual engine
        run: |
          grep -q 'Residual dependency check' index.html
          grep -q 'function residualForGap' index.html
          grep -q 'remaining.length' index.html
      - name: Commit patched Atlas
        run: |
          if git diff --quiet -- index.html; then
            echo 'No Atlas changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(atlas): add residual dependency engine [residual-engine-patched]'
          git push origin HEAD:feat/residual-dependency-engine
