name: Apply Atlas Link Patch

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/patch_atlas_dynamic_links.py'
      - '.github/workflows/apply-atlas-link-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atlas-public-route
      - run: python3 scripts/patch_atlas_dynamic_links.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trainer.html
          git commit -m 'fix: route all Trainer Atlas links through /atlas'
          git push origin HEAD:fix/atlas-public-route
